<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/producto.js"></script>
    <script src="./js/inventario.js"></script>
    <title>Inventario listas enlazadas</title>
</head>
<body>

    <form id="formProducto">

            <label for="txtCod">Código:</label>
            <input type="number" id="txtCod" required>
       
            <label for="txtNombre">Nombre:</label>
            <input type="text" id="txtNombre" required>
       
            <label for="txtCantidad">Cantidad:</label>
            <input type="number" id="txtCantidad" min="0" required>
      
            <label for="txtPrecio">Costo:</label>
            <input type="number" id="txtPrecio" min="0" step="any" required>
        

            <label for="txtPosicion">Posición para insertar:</label>
            <input type="number" id="txtPosicion" min="0" step="1">

        <button type="button" id="btnAdd">Agregar al final</button>
        <button type="button" id="btnAddInicio">Agregar al inicio</button>
        <button type="button" id="btnInsertar">Insertar en posición</button>
        <button type="button" id="btnBuscar">Buscar</button>
        <button type="button" id="btnEliminar">Eliminar</button>
        <button type="button" id="btnExtraerPrimero">Extraer primero</button>
        <button type="button" id="btnListar">Listar</button>
        <button type="reset" id="btnCancelar">Cancelar</button>
    </form>


    <div id="detalles"></div>

    <script src="./js/app.js"></script>

</body>
</html>
